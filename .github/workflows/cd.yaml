name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

jobs:
  cd:
    name: Build and Package
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: production-platform-api

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            -t production-platform-api:${{ github.sha }} \
            ./app

      - name: Prepare ECR image reference
        run: |
          echo "ECR image would be:"
          echo "799517508386.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA}"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: |
          helm lint ./helm

      - name: Validate production Helm values
        run: |
          helm template production-platform ./helm \
            -f ./helm/values-prod.yaml

      - name: Validate ECR image configuration
        run: |
          helm template production-platform ./helm \
            -f ./helm/values-prod.yaml \
            --set image.repository=799517508386.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY} \
            --set image.tag=${GITHUB_SHA}

      - name: Package Helm chart
        run: |
          helm package ./helm \
            --destination ./artifacts

      - name: Upload Helm chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-platform-helm-${{ github.sha }}
          path: ./artifacts/*.tgz
          if-no-files-found: error
